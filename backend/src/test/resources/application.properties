spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

spring.security.oauth2.client.registration.google.client-id=TEST_GOOGLE_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=TEST_GOOGLE_CLIENT_SECRET
spring.security.oauth2.client.registration.google.scope=email,profile

stripe.secret.key=TEST_STRIPE_KEY
stripe.public.key=TEST_STRIPE_PUBLIC_KEY
stripe.webhook.secret=TEST_WEBHOOK_SECRET

spring.h2.console.enabled=true
