<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="${action.id != null} ? 'Modifier l\'action' : 'Nouvelle action'">Formulaire action</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm border-0 rounded-4 p-4">
                <h2 class="mb-4" th:text="${action.id != null} ? 'Modifier l\'action' : 'Nouvelle action'"></h2>
                <div class="mb-3">
                    <label class="form-label">Titre</label>
                    <input id="title" type="text" class="form-control" th:value="${action.title}" placeholder="Ex : Construction d\'une école">
                </div>
                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea id="description" class="form-control" rows="4" placeholder="Description de l\'action" th:text="${action.description}"></textarea>
                </div>
                <div class="row gy-3">
                    <div class="col-md-6">
                        <label class="form-label">Lieu</label>
                        <input id="location" type="text" class="form-control" th:value="${action.location}" placeholder="Ville, région">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Catégorie</label>
                        <input id="category" type="text" class="form-control" th:value="${action.category}" placeholder="education, sante, environnement">
                    </div>
                </div>
                <div class="row gy-3 mt-3">
                    <div class="col-md-4">
                        <label class="form-label">Objectif (MAD)</label>
                        <input id="goalAmount" type="number" min="0" step="0.01" class="form-control" th:value="${action.goalAmount}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Date de début</label>
                        <input id="startDate" type="date" class="form-control" th:value="${action.startDate}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Date de fin</label>
                        <input id="endDate" type="date" class="form-control" th:value="${action.endDate}">
                    </div>
                </div>
                <div class="row gy-3 mt-3">
                    <div class="col-md-6">
                        <label class="form-label">URL de l\'image</label>
                        <input id="imageUrl" type="url" class="form-control" th:value="${action.imageUrl}" placeholder="https://...">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Statut</label>
                        <select id="status" class="form-select">
                            <option th:selected="${action.status == 'ACTIVE'}" value="ACTIVE">ACTIVE</option>
                            <option th:selected="${action.status == 'ARCHIVED'}" value="ARCHIVED">ARCHIVED</option>
                        </select>
                    </div>
                </div>
                <div class="mt-3">
                    <label class="form-label">Organisation</label>
                    <select id="organisationId" class="form-select">
                        <option value="">Aucune organisation</option>
                        <option th:each="org : ${organisations}" th:value="${org.id}"
                                th:text="${org.name}"
                                th:selected="${action.organisation != null and action.organisation.id == org.id}"></option>
                    </select>
                </div>
                <div class="mt-4 d-flex justify-content-between align-items-center">
                    <button class="btn btn-primary" onclick="saveAction(event)">Enregistrer</button>
                    <a th:href="@{/actions}" class="btn btn-outline-secondary">Annuler</a>
                </div>
                <div id="formMessage" class="mt-3 text-danger"></div>
            </div>
        </div>
    </div>
</div>
<script th:inline="javascript">
async function saveAction(event) {
    event.preventDefault();
    const title = document.getElementById('title').value;
    const description = document.getElementById('description').value;
    const location = document.getElementById('location').value;
    const category = document.getElementById('category').value;
    const goalAmount = parseFloat(document.getElementById('goalAmount').value);
    const startDate = document.getElementById('startDate').value;
    const endDate = document.getElementById('endDate').value;
    const imageUrl = document.getElementById('imageUrl').value;
    const status = document.getElementById('status').value;
    const organisationId = document.getElementById('organisationId').value;
    const formMessage = document.getElementById('formMessage');
    const actionId = /*[[${action.id}]]*/ 0;

    const token = localStorage.getItem('token');
    const payload = {
        title,
        description,
        location,
        category,
        goalAmount,
        startDate: startDate || null,
        endDate: endDate || null,
        imageUrl: imageUrl || null,
        status,
        organisation: organisationId ? { id: parseInt(organisationId) } : null
    };

    const method = actionId ? 'PUT' : 'POST';
    const url = actionId ? '/api/actions/' + actionId : '/api/actions';

    const res = await fetch(url, {
        method,
        headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
        },
        body: JSON.stringify(payload)
    });

    if (!res.ok) {
        formMessage.textContent = 'Impossible d\'enregistrer l\'action. Vérifiez les champs et réessayez.';
        return;
    }

    const data = await res.json();
    window.location.href = '/actions/' + data.id;
}
</script>
</body>
</html>
