<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Organisation — Détails</title>
</head>
<body>
  <h1 th:text="${organisation.name}">Organisation Name</h1>
  <p><strong>Adresse:</strong> <span th:text="${organisation.address}">Adresse</span></p>
  <p><strong>Téléphone:</strong> <span th:text="${organisation.phone}">Téléphone</span></p>
  <p><strong>Description:</strong></p>
  <div th:utext="${organisation.description}">Description here</div>

  <a th:href="@{/organisations}">Retour à la liste</a>
</body>
</html>
