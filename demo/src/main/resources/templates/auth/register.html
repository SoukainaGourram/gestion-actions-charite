<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription — HopeConnect</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --green-deep: #0d3d26;
            --green-mid: #1a6b3a;
            --green-light: #2d9e5f;
            --green-pale: #e8f5ee;
            --gold: #c9a84c;
            --white: #ffffff;
            --gray-soft: #f4f6f4;
            --gray-text: #6b7c6e;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--gray-soft);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        .register-container {
            width: 100%;
            max-width: 520px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: center;
            margin-bottom: 32px;
        }
        .brand-icon {
            width: 42px; height: 42px;
            background: linear-gradient(135deg, var(--green-light), var(--gold));
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
        }
        .brand-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            color: var(--green-deep);
        }
        .card {
            background: var(--white);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 4px 40px rgba(13,61,38,0.08);
        }
        .card-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .card-header h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            color: var(--green-deep);
            margin-bottom: 6px;
        }
        .card-header p { color: var(--gray-text); font-size: 0.95rem; }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .form-group { margin-bottom: 0; }
        .form-group.full { grid-column: 1 / -1; }
        .form-label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--green-deep);
            margin-bottom: 7px;
            letter-spacing: 0.3px;
        }
        .form-input, .form-select {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #e2e8e4;
            border-radius: 10px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.92rem;
            color: var(--green-deep);
            background: var(--gray-soft);
            transition: all 0.2s;
            outline: none;
        }
        .form-input:focus, .form-select:focus {
            border-color: var(--green-light);
            background: var(--white);
            box-shadow: 0 0 0 3px rgba(45,158,95,0.1);
        }
        .role-selector {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 4px;
        }
        .role-option {
            border: 1.5px solid #e2e8e4;
            border-radius: 10px;
            padding: 14px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .role-option:hover { border-color: var(--green-light); background: var(--green-pale); }
        .role-option.selected { border-color: var(--green-mid); background: var(--green-pale); }
        .role-option input { display: none; }
        .role-emoji { font-size: 1.5rem; display: block; margin-bottom: 6px; }
        .role-title { font-size: 0.85rem; font-weight: 600; color: var(--green-deep); }
        .role-desc { font-size: 0.75rem; color: var(--gray-text); margin-top: 2px; }
        .btn-register {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--green-mid), var(--green-light));
            color: white;
            border: none;
            border-radius: 10px;
            font-family: 'DM Sans', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 24px;
        }
        .btn-register:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(26,107,58,0.35);
        }
        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9rem;
            color: var(--gray-text);
        }
        .login-link a {
            color: var(--green-mid);
            font-weight: 600;
            text-decoration: none;
        }
        .login-link a:hover { color: var(--green-deep); }
        #hiddenRole { display: none; }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="brand">
            <div class="brand-icon">🌿</div>
            <span class="brand-name">HopeConnect</span>
        </div>

        <div class="card">
            <div class="card-header">
                <h2>Créer un compte</h2>
                <p>Rejoignez notre communauté caritative</p>
            </div>

            <form id="registerForm">
                <div class="form-grid">
                    <div class="form-group full">
                        <label class="form-label">Nom complet</label>
                        <input type="text" id="name" class="form-input" placeholder="Votre nom complet" required>
                    </div>
                    <div class="form-group full">
                        <label class="form-label">Adresse email</label>
                        <input type="email" id="email" class="form-input" placeholder="votre@email.com" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Téléphone</label>
                        <input type="text" id="phone" class="form-input" placeholder="06xxxxxxxx">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Mot de passe</label>
                        <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                    </div>

                    <div class="form-group full">
                        <label class="form-label">Je suis...</label>
                        <input type="hidden" id="hiddenRole" value="USER">
                        <div class="role-selector">
                            <div class="role-option selected" onclick="selectRole('USER', this)">
                                <span class="role-emoji">🤝</span>
                                <div class="role-title">Donateur</div>
                                <div class="role-desc">Je veux soutenir des actions</div>
                            </div>
                            <div class="role-option" onclick="selectRole('ORG_ADMIN', this)">
                                <span class="role-emoji">🏢</span>
                                <div class="role-title">Organisation</div>
                                <div class="role-desc">Je gère des actions caritatives</div>
                            </div>
                        </div>
                    </div>
                </div>

                <button type="button" class="btn-register" onclick="submitRegister()">
                    Créer mon compte →
                </button>
            </form>

            <div class="login-link">
                Déjà un compte ? <a th:href="@{/login}">Se connecter</a>
            </div>
        </div>
    </div>

    <script>
        function selectRole(role, el) {
            document.querySelectorAll('.role-option').forEach(o => o.classList.remove('selected'));
            el.classList.add('selected');
            document.getElementById('hiddenRole').value = role;
        }

        async function submitRegister() {
            const data = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                password: document.getElementById('password').value,
                role: document.getElementById('hiddenRole').value
            };
            if (!data.name || !data.email || !data.password) {
                alert('Veuillez remplir tous les champs obligatoires.');
                return;
            }
            const res = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            if (res.ok) {
                alert('Compte créé avec succès ! Connectez-vous.');
                window.location.href = '/login';
            } else {
                alert(await res.text());
            }
        }
    </script>
</body>
</html>
